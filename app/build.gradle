plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.mt.plugin)
}

// 加快构建速度
tasks.configureEach { task ->
    if (task.name.contains("lint")) {
        task.enabled = false
    }
}

def javaVersion = JavaVersion.VERSION_17

android {
    // 固定这个就行，不需要改
    namespace = 'bin.mt.plugin.pusher'
    compileSdk = 36

    defaultConfig {
        //noinspection ExpiredTargetSdkVersion
        targetSdk = 28
        minSdk = 21
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility javaVersion
        targetCompatibility javaVersion
    }
}

dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs
}

/**
 * MT 插件配置
 */
mtPlugin {
    // 插件唯一标识
    pluginID = "com.example.manifesteditor"
    versionCode = 4
    versionName = "v1.3"
    // 插件名称与描述
    name = "Manifest 可视化编辑器"
    description = "在文本编辑器中查看 AndroidManifest.xml 时，通过「编辑」菜单打开可视化面板：查看应用信息、SDK 版本、组件列表，集中管理权限（中文说明、一键删除、快捷添加常用权限、定位到原文），修改后一键写回编辑器。"
    // 主设置界面
    mainPreference = "com.example.manifesteditor.PluginSettings"
    // 插件对外接口
    interfaces = [
            "com.example.manifesteditor.ManifestToolMenu",
    ]
}
